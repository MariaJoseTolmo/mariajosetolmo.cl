schema: spec-driven

context: |
  Project: web_cv - public portfolio (mariajosetolmo.cl); the site is itself the code sample. Source of truth: docs/brief.md.
  Code so far: npm workspace with apps/api (NestJS 12, hexagonal health slice, Swagger at /api/docs), CI and local docker-compose. Stack (rest planned): Next.js static export (S3+CloudFront); NestJS hexagonal API (prefix /api) on AWS Lambda; PostgreSQL + TypeORM; Redis (Upstash/Docker); EventPublisher port (Kafka local, SQS prod).
  Auth: magic link + JWT RS256 + rotating refresh, roles RECRUITER/ADMIN. IaC in TypeScript (SST vs CDK pending). CI/CD: GitHub Actions + OIDC.
  Testing: Jest 30 + ts-jest (unit) and supertest (e2e), strict TDD active; E2E of login flow planned.
  Style: TypeScript strict, ESLint, conventional commits. Public repo: no personal data, no former-employer code.
  Rule: every technology not in the CV needs an ADR under openspec/.

testing:
  strict_tdd: true
  runner:
    name: jest
    command: "npm test"
  layers:
    unit: "jest (apps/api/src/**/*.spec.ts)"
    integration: planned
    e2e: "jest + supertest (npm run test:e2e)"
  coverage:
    command: "npm run test:cov"
    threshold: 80
  quality:
    linter: "eslint (npm run lint)"
    type_checker: "tsc --strict (npm run typecheck)"
    formatter: "prettier (npm run format:check)"

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag any technology absent from the CV and require an ADR
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Never include personal data (phone, salary, availability) in specs or examples
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale; ADRs record problem, alternatives, choice, relation to CV
    - Keep domain independent of Lambda/AWS (hexagonal ports and adapters)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Include Review Workload Forecast (400-line PR budget)
  apply:
    conventions:
      - Follow hexagonal layering and brief.md security requirements
      - Conventional commits only
    tdd: true
    test_command: "npm test && npm run test:e2e"
  verify:
    test_command: "npm test && npm run test:e2e"
    build_command: "npm run build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
